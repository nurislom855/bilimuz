<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BilimUz — O'quv platformasi</title>
<style>
:root{--bg:#f5f6fb;--card:#fff;--ink:#1c1f33;--mute:#6b7089;--pri:#5b5bf0;--pri2:#8b5cf6;--ok:#16a34a;--bad:#dc2626;--line:#e4e6f0;--shadow:0 4px 18px rgba(40,40,90,.08)}
@media(prefers-color-scheme:dark){:root{--bg:#12131c;--card:#1b1d2b;--ink:#eceefb;--mute:#9a9fba;--line:#2a2d42;--shadow:0 4px 18px rgba(0,0,0,.4)}}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink);display:flex;min-height:100vh}
aside{width:240px;background:var(--card);border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh}
.logo{font-weight:800;font-size:22px;padding:4px 10px 16px;background:linear-gradient(90deg,var(--pri),var(--pri2));-webkit-background-clip:text;background-clip:text;color:transparent}
nav button{all:unset;display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:10px;cursor:pointer;color:var(--mute);font-weight:600;width:calc(100% - 24px)}
nav button:hover{background:var(--bg)}
nav button.on{background:linear-gradient(90deg,var(--pri),var(--pri2));color:#fff}
.sp{flex:1}
main{flex:1;padding:28px;max-width:960px;margin:0 auto;width:100%}
h1{margin:0 0 4px;font-size:26px}
.sub{color:var(--mute);margin:0 0 22px}
.card{background:var(--card);border-radius:16px;padding:20px;box-shadow:var(--shadow);margin-bottom:16px;border:1px solid var(--line)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.tile{cursor:pointer;transition:.15s}.tile:hover{transform:translateY(-3px)}
.tile .e{font-size:30px}.tile h3{margin:8px 0 4px}.tile p{margin:0;color:var(--mute);font-size:14px}
input,textarea,select{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
textarea{min-height:130px;resize:vertical}
.row{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}.row>*{flex:1;min-width:140px}
.btn{background:linear-gradient(90deg,var(--pri),var(--pri2));color:#fff;border:0;padding:11px 18px;border-radius:10px;font-weight:700;cursor:pointer;font:inherit;font-weight:700}
.btn.g{background:var(--bg);color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.5;cursor:wait}
#chat{height:52vh;overflow:auto;display:flex;flex-direction:column;gap:10px;padding:4px}
.m{max-width:85%;padding:11px 14px;border-radius:14px;line-height:1.55;white-space:pre-wrap;word-wrap:break-word}
.m.u{align-self:flex-end;background:linear-gradient(90deg,var(--pri),var(--pri2));color:#fff}
.m.a{align-self:flex-start;background:var(--bg);border:1px solid var(--line)}
.m code,.out code{background:rgba(120,120,160,.2);padding:1px 5px;border-radius:5px}
.m pre,.out pre{background:#161827;color:#e8eaff;padding:12px;border-radius:10px;overflow:auto;white-space:pre}
.out{line-height:1.65;white-space:pre-wrap}
.opt{display:block;width:100%;text-align:left;padding:11px 14px;margin:6px 0;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);cursor:pointer;font:inherit}
.opt:hover{border-color:var(--pri)}
.opt.ok{background:rgba(22,163,74,.15);border-color:var(--ok)}.opt.bad{background:rgba(220,38,38,.13);border-color:var(--bad)}
.exp{margin-top:8px;color:var(--mute);font-size:14px}
.fc{height:170px;perspective:800px;cursor:pointer}
.fc>div{position:relative;width:100%;height:100%;transition:.5s;transform-style:preserve-3d}
.fc.flip>div{transform:rotateY(180deg)}
.fc .f,.fc .b{position:absolute;inset:0;backface-visibility:hidden;display:flex;align-items:center;justify-content:center;text-align:center;padding:16px;border-radius:14px;border:1px solid var(--line);background:var(--card);box-shadow:var(--shadow)}
.fc .b{transform:rotateY(180deg);background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff}
.task{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.task input[type=checkbox]{width:20px;height:20px}.task span{flex:1}.task.d span{text-decoration:line-through;color:var(--mute)}
.bar{height:10px;background:var(--bg);border-radius:6px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--pri),var(--pri2));transition:.3s;width:0}
.warn{background:rgba(245,158,11,.14);border:1px solid #f59e0b;padding:12px 14px;border-radius:10px;margin-bottom:14px;font-size:14px}
.stats{display:flex;gap:14px;flex-wrap:wrap}.stat{flex:1;min-width:120px;text-align:center}.stat b{font-size:28px;display:block}
@media(max-width:760px){body{flex-direction:column}aside{width:100%;height:auto;position:static;flex-direction:row;flex-wrap:wrap;padding:10px}.logo{padding:4px 8px}nav{display:flex;flex-wrap:wrap}nav button{width:auto}.sp{display:none}main{padding:16px}}
</style>
</head>
<body>
<aside>
  <div class="logo">🎓 BilimUz</div>
  <nav id="nav"></nav>
  <div class="sp"></div>
  <nav><button data-p="settings">⚙️ Sozlamalar</button></nav>
</aside>
<main id="main"></main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const $=(s,r=document)=>r.querySelector(s);
const store={get:(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function md(t){
  t=esc(t);
  t=t.replace(/```(\w*)\n?([\s\S]*?)```/g,(_,l,c)=>'<pre>'+c+'</pre>');
  t=t.replace(/`([^`\n]+)`/g,'<code>$1</code>').replace(/\*\*([^*\n]+)\*\*/g,'<b>$1</b>');
  t=t.replace(/^#{1,3}\s*(.+)$/gm,'<b>$1</b>').replace(/^\s*[\*\-]\s+/gm,'• ');
  return t;
}
const pages=[
 ['home','🏠 Bosh sahifa'],['tutor','🤖 AI Ustoz'],['summary','📝 Konspekt'],
 ['quiz','🧪 Test'],['cards','🃏 Kartochkalar'],['plan','✅ Reja'],['account','👤 Hisob']
];
const SUPABASE_URL='https://bncetlipguctqschkblj.supabase.co';
const SUPABASE_KEY='sb_publishable_9GDih0IeBD0aJu198Lr7pQ_f4HrzhTh'; // ommaviy (publishable) kalit, RLS himoyalaydi
const sb=window.supabase?window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY):null;
let cur='home';
const S={user:null,lang:store.get('lang','o\'zbek'),
 chat:[],tasks:store.get('tasks',[]),stats:store.get('stats',{asked:0,quiz:0,right:0})};

async function gemini(prompt,{history=[],system='',json=false}={}){
  if(!sb) throw new Error('Supabase yuklanmadi (internet aloqasini tekshiring).');
  if(!S.user) throw new Error('Gemini ishlashi uchun avval "Hisob" bo\'limida kiring.');
  const{data,error}=await sb.functions.invoke('gemini',{body:{
    systemInstruction:{parts:[{text:`Sen BilimUz platformasidagi yordamchi o'qituvchisan. Javoblarni ${S.lang} tilida, aniq va tushunarli yoz. ${system}`}]},
    contents:[...history,{role:'user',parts:[{text:prompt}]}],
    json
  }});
  if(error){
    let m=error.message;
    try{const j=await error.context.json();if(j&&j.error)m=j.error}catch(e){}
    throw new Error(m);
  }
  if(!data||!data.text) throw new Error((data&&data.error)||'Gemini bo\'sh javob qaytardi.');
  return data.text;
}
const persist=()=>store.set('tasks',S.tasks.map(({t,d,id})=>({t,d,id})));
async function dbTaskAdd(t){if(!S.user)return;const{data}=await sb.from('tasks').insert({title:t.t,done:t.d}).select('id').single();if(data)t.id=data.id}
async function dbTaskUpdate(t){if(!S.user||!t.id)return;await sb.from('tasks').update({done:t.d}).eq('id',t.id)}
async function dbTaskDelete(t){if(!S.user||!t.id)return;await sb.from('tasks').delete().eq('id',t.id)}
async function dbQuiz(topic,level,total,correct){if(!S.user)return;await sb.from('quiz_results').insert({topic,level,total,correct})}
async function dbChat(role,content){if(!S.user)return;await sb.from('chat_messages').insert({role,content})}
async function dbChatClear(){if(!S.user)return;await sb.from('chat_messages').delete().eq('user_id',S.user.id)}
async function dbLoad(){
  if(!S.user)return;
  const t=await sb.from('tasks').select('id,title,done').order('id');
  if(t.data){
    if(!t.data.length&&S.tasks.length){for(const x of S.tasks)await dbTaskAdd(x)}
    else S.tasks=t.data.map(r=>({id:r.id,t:r.title,d:r.done}));
    persist();
  }
  const q=await sb.from('quiz_results').select('total,correct');
  if(q.data){S.stats.quiz=q.data.reduce((a,r)=>a+r.total,0);S.stats.right=q.data.reduce((a,r)=>a+r.correct,0)}
  const c=await sb.from('chat_messages').select('role,content').order('id',{ascending:false}).limit(40);
  if(c.data){S.chat=c.data.reverse().map(r=>({role:r.role,parts:[{text:r.content}]}))}
  const n=await sb.from('chat_messages').select('id',{count:'exact',head:true}).eq('role','user');
  if(n.count!=null)S.stats.asked=n.count;
  store.set('stats',S.stats);
}
const parseJSON=t=>JSON.parse(t.replace(/^```json\s*|```$/g,'').trim());
const keyWarn=()=>S.user?'':'<div class="warn">🔐 Gemini ishlashi uchun <a href="#" onclick="go(\'account\');return false">hisobga kiring</a>.</div>';

function go(p){
  cur=p;
  $('#nav').innerHTML=pages.map(([id,l])=>`<button data-p="${id}" class="${id===p?'on':''}">${l}</button>`).join('');
  document.querySelectorAll('button[data-p]').forEach(b=>{b.onclick=()=>go(b.dataset.p);if(b.dataset.p==='settings')b.classList.toggle('on',p==='settings')});
  $('#main').innerHTML='';
  views[p]($('#main'));
  scrollTo(0,0);
}

const views={
home(m){
  const done=S.tasks.filter(t=>t.d).length;
  m.innerHTML=`<h1>Xush kelibsiz${S.user?', '+esc(S.user.email.split('@')[0]):''}! 👋</h1><p class="sub">Gemini AI bilan o'qishni osonlashtiring.</p>${keyWarn()}
  ${S.user?'':'<div class="warn">💾 Ma\'lumotlaringiz saqlanishi uchun <a href="#" onclick="go(\'account\');return false">hisobga kiring</a>.</div>'}
  <div class="card stats">
    <div class="stat"><b>${S.stats.asked}</b>AI savollar</div>
    <div class="stat"><b>${S.stats.quiz}</b>Test savollari</div>
    <div class="stat"><b>${S.stats.quiz?Math.round(S.stats.right/S.stats.quiz*100):0}%</b>To'g'ri javoblar</div>
    <div class="stat"><b>${done}/${S.tasks.length}</b>Vazifalar</div>
  </div>
  <div class="grid">${pages.slice(1,-1).map(([id,l])=>{const[e,...n]=l.split(' ');const d={tutor:'Istalgan mavzuda savol bering',summary:'Matnni qisqa konspektga aylantiring',quiz:'Mavzu bo\'yicha bilimingizni sinang',cards:'Yodlash uchun kartochkalar',plan:'Vazifa va rejalar'}[id];
  return `<div class="card tile" onclick="go('${id}')"><div class="e">${e}</div><h3>${n.join(' ')}</h3><p>${d}</p></div>`}).join('')}</div>`;
},
tutor(m){
  m.innerHTML=`<h1>🤖 AI Ustoz</h1><p class="sub">Dars, uy vazifasi yoki tushunmagan mavzu bo'yicha so'rang.</p>${keyWarn()}
  <div class="card"><div id="chat"></div>
  <div class="row"><textarea id="q" style="min-height:60px" placeholder="Savolingizni yozing..."></textarea></div>
  <div class="row"><button class="btn" id="send">Yuborish</button><button class="btn g" id="clr">Tozalash</button></div></div>`;
  const chat=$('#chat');
  const draw=()=>{chat.innerHTML=S.chat.map(x=>`<div class="m ${x.role==='user'?'u':'a'}">${md(x.parts[0].text)}</div>`).join('')||'<div class="m a">Salom! Men sizning AI ustozingizman. Nimani o\'rganamiz?</div>';chat.scrollTop=chat.scrollHeight};
  draw();
  const send=async()=>{
    const q=$('#q').value.trim();if(!q)return;
    $('#q').value='';$('#send').disabled=true;
    const hist=S.chat.slice();
    S.chat.push({role:'user',parts:[{text:q}]});draw();
    chat.insertAdjacentHTML('beforeend','<div class="m a" id="typ">Yozmoqda...</div>');chat.scrollTop=chat.scrollHeight;
    try{
      const a=await gemini(q,{history:hist,system:'Qadam-baqadam tushuntir va oxirida qisqa misol yoki mashq ber.'});
      S.chat.push({role:'model',parts:[{text:a}]});S.stats.asked++;store.set('stats',S.stats);dbChat('user',q);dbChat('model',a);
    }catch(e){S.chat.pop();S.chat.push({role:'user',parts:[{text:q}]});S.chat.push({role:'model',parts:[{text:'⚠️ '+e.message}]})}
    $('#send').disabled=false;draw();
  };
  $('#send').onclick=send;
  $('#q').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}};
  $('#clr').onclick=()=>{S.chat=[];dbChatClear();draw()};
},
summary(m){
  m.innerHTML=`<h1>📝 Konspekt</h1><p class="sub">Matnni joylang — Gemini qisqa konspekt qilib beradi.</p>${keyWarn()}
  <div class="card"><textarea id="t" placeholder="Darslik yoki maqola matnini shu yerga joylang..."></textarea>
  <div class="row"><select id="mode"><option value="qisqa konspekt (asosiy g'oyalar, band-band)">Qisqa konspekt</option><option value="oddiy so'zlar bilan, 10 yoshli bolaga tushuntirgandek">Oddiy tushuntirish</option><option value="muhim atamalar lug'ati (atama — izoh)">Atamalar lug'ati</option><option value="imtihonga tayyorlanish uchun 10 ta muhim savol va javob">Imtihon savollari</option></select>
  <button class="btn" id="go">Tayyorlash</button></div></div><div class="card out" id="o" style="display:none"></div>`;
  $('#go').onclick=async()=>{
    const t=$('#t').value.trim();if(!t)return;
    const o=$('#o');o.style.display='block';o.textContent='Tayyorlanmoqda...';$('#go').disabled=true;
    try{o.innerHTML=md(await gemini(`Quyidagi matndan ${$('#mode').value} tayyorla:\n\n${t}`))}catch(e){o.textContent='⚠️ '+e.message}
    $('#go').disabled=false;
  };
},
quiz(m){
  m.innerHTML=`<h1>🧪 Test</h1><p class="sub">Mavzuni yozing — Gemini test tuzadi.</p>${keyWarn()}
  <div class="card"><div class="row"><input id="topic" placeholder="Mavzu (masalan: Fotosintez, Python sikllari...)"><select id="n"><option>5</option><option>10</option><option>15</option></select><select id="lvl"><option>oson</option><option selected>o'rta</option><option>qiyin</option></select><button class="btn" id="go">Test tuzish</button></div></div><div id="qs"></div>`;
  $('#go').onclick=async()=>{
    const tp=$('#topic').value.trim();if(!tp)return;
    $('#go').disabled=true;$('#qs').innerHTML='<div class="card">Savollar tayyorlanmoqda...</div>';
    try{
      const j=parseJSON(await gemini(`"${tp}" mavzusida ${$('#n').value} ta ${$('#lvl').value} darajadagi test savoli tuz. FAQAT JSON massiv qaytar: [{"q":"savol","options":["A","B","C","D"],"answer":0,"explanation":"qisqa izoh"}]. "answer" — to'g'ri variant indeksi (0-3).`,{json:true}));
      $('#qs').innerHTML='';let score=0,ans=0;
      j.forEach((x,i)=>{
        const c=document.createElement('div');c.className='card';
        c.innerHTML=`<b>${i+1}. ${esc(x.q)}</b>`+x.options.map((o,k)=>`<button class="opt" data-k="${k}">${esc(o)}</button>`).join('')+'<div class="exp" style="display:none"></div>';
        c.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
          if(c.dataset.done)return;c.dataset.done=1;ans++;
          const k=+b.dataset.k;S.stats.quiz++;
          if(k===x.answer){b.classList.add('ok');score++;S.stats.right++}else{b.classList.add('bad');c.querySelectorAll('.opt')[x.answer].classList.add('ok')}
          store.set('stats',S.stats);
          const e=$('.exp',c);e.style.display='block';e.textContent='💡 '+(x.explanation||'');
          if(ans===j.length&&(dbQuiz(tp,$('#lvl').value,j.length,score),true))$('#qs').insertAdjacentHTML('beforeend',`<div class="card"><h2>Natija: ${score}/${j.length} (${Math.round(score/j.length*100)}%)</h2></div>`);
        });
        $('#qs').appendChild(c);
      });
    }catch(e){$('#qs').innerHTML='<div class="card">⚠️ '+esc(e.message)+'</div>'}
    $('#go').disabled=false;
  };
},
cards(m){
  m.innerHTML=`<h1>🃏 Kartochkalar</h1><p class="sub">Kartani bosing — javobni ko'rasiz.</p>${keyWarn()}
  <div class="card"><div class="row"><input id="topic" placeholder="Mavzu (masalan: Ingliz tili — fe'llar)"><select id="n"><option>6</option><option>10</option><option>16</option></select><button class="btn" id="go">Yaratish</button></div></div><div class="grid" id="cs"></div>`;
  $('#go').onclick=async()=>{
    const tp=$('#topic').value.trim();if(!tp)return;
    $('#go').disabled=true;$('#cs').innerHTML='<div class="card">Tayyorlanmoqda...</div>';
    try{
      const j=parseJSON(await gemini(`"${tp}" mavzusida ${$('#n').value} ta yodlash kartochkasi tuz. FAQAT JSON massiv: [{"front":"savol yoki atama","back":"qisqa javob"}]`,{json:true}));
      $('#cs').innerHTML=j.map(x=>`<div class="fc"><div><div class="f"><b>${esc(x.front)}</b></div><div class="b">${esc(x.back)}</div></div></div>`).join('');
      document.querySelectorAll('.fc').forEach(f=>f.onclick=()=>f.classList.toggle('flip'));
    }catch(e){$('#cs').innerHTML='<div class="card">⚠️ '+esc(e.message)+'</div>'}
    $('#go').disabled=false;
  };
},
plan(m){
  const draw=()=>{
    const d=S.tasks.filter(t=>t.d).length,p=S.tasks.length?Math.round(d/S.tasks.length*100):0;
    $('#pl').innerHTML=`<div class="bar"><i style="width:${p}%"></i></div><small>${d}/${S.tasks.length} bajarildi (${p}%)</small>`+
    S.tasks.map((t,i)=>`<div class="task ${t.d?'d':''}"><input type="checkbox" ${t.d?'checked':''} data-i="${i}"><span>${esc(t.t)}</span><button class="btn g" data-x="${i}">✕</button></div>`).join('');
    document.querySelectorAll('[data-i]').forEach(c=>c.onchange=()=>{const t=S.tasks[c.dataset.i];t.d=c.checked;persist();dbTaskUpdate(t);draw()});
    document.querySelectorAll('[data-x]').forEach(c=>c.onclick=()=>{const[t]=S.tasks.splice(c.dataset.x,1);persist();dbTaskDelete(t);draw()});
  };
  m.innerHTML=`<h1>✅ O'quv reja</h1><p class="sub">Vazifalaringizni kuzating yoki Gemini'dan reja tuzdiring.</p>${keyWarn()}
  <div class="card"><div class="row"><input id="nt" placeholder="Yangi vazifa..."><button class="btn" id="add">Qo'shish</button></div>
  <div class="row"><input id="goal" placeholder="Maqsad (masalan: 1 haftada IELTS Writing'ga tayyorlanish)"><button class="btn g" id="ai">✨ AI reja tuzsin</button></div></div>
  <div class="card" id="pl"></div>`;
  const add=()=>{const v=$('#nt').value.trim();if(!v)return;const t={t:v,d:false};S.tasks.push(t);persist();dbTaskAdd(t);$('#nt').value='';draw()};
  $('#add').onclick=add;$('#nt').onkeydown=e=>{if(e.key==='Enter')add()};
  $('#ai').onclick=async()=>{
    const g=$('#goal').value.trim();if(!g)return;$('#ai').disabled=true;
    try{
      const j=parseJSON(await gemini(`Talaba uchun maqsad: "${g}". 6-10 ta aniq, kichik o'quv vazifasidan iborat reja tuz. FAQAT JSON massiv: ["vazifa 1","vazifa 2"]`,{json:true}));
      j.forEach(x=>{const t={t:String(x),d:false};S.tasks.push(t);dbTaskAdd(t)});persist();draw();
    }catch(e){alert(e.message)}
    $('#ai').disabled=false;
  };
  draw();
},
account(m){
  if(!sb){m.innerHTML='<h1>👤 Hisob</h1><div class="warn">Supabase yuklanmadi (internet aloqasini tekshiring).</div>';return}
  if(S.user){
    m.innerHTML=`<h1>👤 Hisob</h1><p class="sub">Ma'lumotlaringiz bulutda saqlanmoqda.</p>
    <div class="card"><p><b>${esc(S.user.email)}</b></p><button class="btn g" id="out">Chiqish</button></div>`;
    $('#out').onclick=async()=>{await sb.auth.signOut();S.chat=[];S.tasks=[];persist();go('account')};
    return;
  }
  m.innerHTML=`<h1>👤 Hisob</h1><p class="sub">Kiring yoki ro'yxatdan o'ting — vazifalar, test natijalari va chat tarixi saqlanadi.</p>
  <div class="card"><div class="row"><input id="em" type="email" placeholder="Email" autocomplete="email"></div>
  <div class="row"><input id="pw" type="password" placeholder="Parol (kamida 6 belgi)" autocomplete="current-password"></div>
  <div class="row"><button class="btn" id="in">Kirish</button><button class="btn g" id="up">Ro'yxatdan o'tish</button></div><div id="am"></div></div>`;
  const msg=t=>$('#am').textContent=t;
  $('#in').onclick=async()=>{msg('Kutilmoqda...');const{error}=await sb.auth.signInWithPassword({email:$('#em').value.trim(),password:$('#pw').value});if(error)msg('⚠️ '+error.message)};
  $('#up').onclick=async()=>{msg('Kutilmoqda...');const{data,error}=await sb.auth.signUp({email:$('#em').value.trim(),password:$('#pw').value});if(error)msg('⚠️ '+error.message);else if(!data.session)msg('✅ Emailingizga tasdiqlash xati yuborildi. Tasdiqlagach kiring.')};
},
settings(m){
  m.innerHTML=`<h1>⚙️ Sozlamalar</h1><p class="sub">Gemini AI serverda ulangan, kalit kiritish shart emas.</p>
  <div class="card"><label><b>Javob tili</b></label><div class="row"><select id="lg"><option>o'zbek</option><option>rus</option><option>ingliz</option></select></div>
  <div class="row"><button class="btn" id="sv">Saqlash</button><button class="btn g" id="ts">Gemini ulanishini tekshirish</button></div><div id="msg"></div></div>`;
  $('#lg').value=S.lang;
  const save=()=>{S.lang=$('#lg').value;store.set('lang',S.lang)};
  $('#sv').onclick=()=>{save();$('#msg').textContent='✅ Saqlandi'};
  $('#ts').onclick=async()=>{save();$('#msg').textContent='Tekshirilmoqda...';try{await gemini('Salom de, bitta so\'z bilan.');$('#msg').textContent='✅ Gemini ulandi!'}catch(e){$('#msg').textContent='⚠️ '+e.message}};
}
};
if(sb)sb.auth.onAuthStateChange((ev,session)=>{
  S.user=session?session.user:null;
  if(ev==='INITIAL_SESSION'||ev==='SIGNED_IN'||ev==='SIGNED_OUT'){
    setTimeout(async()=>{await dbLoad();go(cur==='account'&&S.user?'home':cur)},0);
  }
});
go('home');
</script>
</body>
</html>
